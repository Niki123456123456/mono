name: sketch3

on:
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  sketch3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain for wasm
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-

      - name: Build sketch3
        run: cd ./crates/sketch3 ; ../../trunk build --release --public-url $public_url --dist ../../gh-pages/sketch3
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sketch3"

      - name: Prepare index.html and inject hashes (no Python)
        run: |
          set -euo pipefail

          PAGE_SRC="crates/sketch3/src/assets/page.html"
          OUT_DIR="gh-pages/sketch3"
          DEST="$OUT_DIR/index.html"

          # Ensure output dir exists
          mkdir -p "$OUT_DIR"

          # Replace ../../gh-pages/sketch3/index.html with ./crates/sketch3/src/assets/page.html
          cp "$PAGE_SRC" "$DEST"

          # Find JS file: expects pattern sketch3-<version>.js
          JS_FILE=$(echo "$OUT_DIR"/sketch3-*.js)
          if [ ! -f "$JS_FILE" ]; then
            echo "Error: Could not find JS file matching $OUT_DIR/sketch3-*.js"
            ls -al "$OUT_DIR" || true
            exit 1
          fi

          JS_BASENAME=$(basename "$JS_FILE")
          VERSION="${JS_BASENAME#sketch3-}"
          VERSION="${VERSION%.js}"

          echo "Detected version: $VERSION"

          # WASM file: sketch3-<version>_bg.wasm
          WASM_FILE="$OUT_DIR/sketch3-${VERSION}_bg.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "Error: Expected WASM file $WASM_FILE not found."
            ls -al "$OUT_DIR" || true
            exit 1
          fi

          # Compute sha384 (Base64) for JS and WASM
          JS_SHA=$(openssl dgst -sha384 -binary "$JS_FILE" | openssl base64 -A)
          WASM_SHA=$(openssl dgst -sha384 -binary "$WASM_FILE" | openssl base64 -A)

          echo "JS sha384 (base64):   $JS_SHA"
          echo "WASM sha384 (base64): $WASM_SHA"

          # Export so perl can read them from %ENV
          export VERSION JS_SHA WASM_SHA

          # Replace placeholders in index.html
          perl -pi -e 's/\{version\}/$ENV{VERSION}/g'    "$DEST"
          perl -pi -e 's/\{js-sha\}/$ENV{JS_SHA}/g'      "$DEST"
          perl -pi -e 's/\{wasm-sha\}/$ENV{WASM_SHA}/g'  "$DEST"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages
          single-commit: true
