name: Deployboard macOS installer

on:
  push:
    paths:
      - 'crates/deployboard/src/**'
      - 'crates/deployboard/Cargo.toml'
      - 'crates/deployboard/package-macos.sh'
      - 'crates/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deployboard-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployboard-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "aarch64-apple-darwin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: deployboard-aarch64-apple-darwin
      - name: Build Deployboard
        run: cargo build --locked --release --package deployboard --bin deployboard --target "aarch64-apple-darwin"
      - name: Create DMG installer
        run: bash crates/deployboard/package-macos.sh "aarch64-apple-darwin" "apple-silicon"
      - name: Preserve installer download if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: deployboard-macos-apple-silicon
          path: dist/deployboard-macos-apple-silicon.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: deployboard-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::GitHub release operation failed (attempt $attempt/5); retrying."
                sleep "$((attempt * 10))"
              fi
            done
            echo "::error::GitHub release operation failed after 5 attempts. The DMG is available in this run's artifacts."
            return 1
          }
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Deployboard for Apple Silicon (M-series Macs), requiring macOS 13 or later.

          Download `deployboard-macos-apple-silicon.dmg`, open it, and drag Deployboard into Applications.

          This build is ad-hoc signed and is not Apple-notarized. See `crates/deployboard/README.md` for first-launch instructions.
          NOTES
          ensure_release() {
            # A failed response can still leave a release on GitHub.
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              return 0
            fi
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Deployboard Apple Silicon build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          }
          retry ensure_release
          retry gh release upload "$RELEASE_TAG" \
            dist/deployboard-macos-apple-silicon.dmg --clobber
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          {
            echo "### Deployboard for Apple Silicon"
            echo "[Download installer from GitHub Releases]($release_url)."
            echo "Open the DMG and drag Deployboard into Applications."
          } >> "$GITHUB_STEP_SUMMARY"
